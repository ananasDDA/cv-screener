[project]
name = "cv-screener"
version = "0.1.0"
description = "Synthetic CV dataset generator, hybrid vector search and a tool-using CLI agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=1.50",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "chromadb>=0.5",
    "fastembed>=0.3",
    "jinja2>=3.1",
    "weasyprint>=62",
    "faker>=28",
    "pillow>=10",
    "rich>=13",
    "typer>=0.12",
]

[project.scripts]
cv = "cv_screener.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cv_screener"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Prompts and the persona table are long by nature.
"src/cv_screener/generate/generator.py" = ["E501"]
"src/cv_screener/generate/personas.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

